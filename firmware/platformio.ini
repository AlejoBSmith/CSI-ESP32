[platformio]
default_envs = rx
src_dir = main

[env]
platform = espressif32@6.12.0
framework = espidf
board = seeed_xiao_esp32s3
board_build.partitions = ../partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 3000000
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
extra_scripts = pre:version.py

[env:rx]
build_flags = -DRAT_NODE_ID=1 -DRAT_USB_NATIVE=1

[env:tx]
build_flags = -DRAT_NODE_ID=0 -DRAT_TX=1 -DRAT_USB_NATIVE=1
